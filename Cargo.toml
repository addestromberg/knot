[workspace]
members = ["crates/knot-core", "crates/knot-store", "crates/knot-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
knot-core = { path = "crates/knot-core" }
knot-store = { path = "crates/knot-store" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_canonicalizer = "0.4.1"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
toml = "1.1.8"
thiserror = "2.0.21"
tempfile = "3.27.0"
ignore = "0.4.34"
unicode-normalization = "0.1.26"
unicode-casefold = "0.2.0"
similar = "3.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
